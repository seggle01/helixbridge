hydra:
  run:
    dir: /home/galileo-group/share/data/adam-data/14384/159231/hydra
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath:
  - file:///opt/rfd4/configs
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - precision=32-true
    - nn.tri_mult_backend=torch
    - nn.attention_type=torch
    - compile_lengths=null
  job:
    name: generate
    chdir: null
    override_dirname: compile_lengths=null,nn.attention_type=torch,nn.tri_mult_backend=torch,precision=32-true
    id: ???
    num: ???
    config_name: request
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /home/galileo-group/share/data/adam-data/14384/159231
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/galileo-group/share/data/adam-data/14384/159231/request_config
      schema: file
      provider: main
    - path: /opt/rfd4/configs
      schema: file
      provider: hydra.searchpath in main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/galileo-group/share/data/adam-data/14384/159231/hydra
    choices:
      recycle_strategy: medium/front_loaded
      inference_experiment: inference_on_user_inputs
      metrics: all_metrics
      metrics/custom_metrics: all_custom_metrics
      metrics/pre_oracle_filters: all_pre_oracle_filters
      metrics/pass_criteria: all_pass_criteria
      metrics/refolding_metrics: all_refolding_metrics
      metrics/refolding_oracles: af3
      metrics/inline_metrics: all_inline_metrics
      generation: inference_base
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
